<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Done — Atria</title>
<meta name="description" content="Done">
<meta name="theme-color" content="#111111">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&f[]=general-sans@300,400,500,600&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">

</head>
<body>

<main id="main">
<style>
body{overflow-x:hidden}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth__aside{position:relative;background:var(--ink);color:var(--paper);padding:var(--s-8) var(--s-9);
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.auth__aside .plate{position:absolute;inset:0;opacity:.5}
.auth__aside > *{position:relative;z-index:1}
.auth__main{display:flex;align-items:center;justify-content:center;padding:var(--s-9) var(--s-7)}
.auth__form{width:100%;max-width:420px}
.auth__form--wide{max-width:520px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth__aside{display:none}}
.social{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.divider{display:flex;align-items:center;gap:var(--s-4);color:var(--stone);font-size:var(--t-cap)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hairline)}
.check-icon{width:72px;height:72px;border:1px solid var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green)}
.check-icon svg{animation:pop 620ms var(--ease)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
</style>
<section class="auth">
  <aside class="auth__aside">
    <div class="plate plate--light"></div>
    <a class="brand" href="index.html" aria-label="Atria, home"><svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
<path d="M2 21 12 3l10 18" stroke="currentColor" stroke-width="1.1"/>
<path d="M7.4 21 12 12.6 16.6 21" stroke="#C8A96A" stroke-width="1.1"/></svg><span class="brand__word">Atria</span></a>
    <div>
      <p class="quote" style="max-width:26ch">&ldquo;Security is boring until the day it isn't.&rdquo;</p>
      <p class="cap mt-6">Atria security policy</p>
    </div>
    <div class="row gap-8"><div><p class="h2 num">41</p><p class="stat__l">Residences</p></div><div><p class="h2 num">12</p><p class="stat__l">Off-market</p></div><div><p class="h2 num">28</p><p class="stat__l">Advisors</p></div></div>
  </aside>
  <div class="auth__main"><div class="auth__form center stack" style="align-items:center">
  <span class="check-icon"><svg viewBox="0 0 20 20" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 10.6 8 14.5 16 5.8"/></svg></span>
  <h1 class="d3 mt-7">Password updated</h1>
  <p class="b2 ink60 mt-3 measure-s">You have been signed out on all other devices. Sign in again with the new password.</p>
  <a class="btn btn--primary btn--lg mt-8" href="login.html">Sign in</a>
  <a class="link link--quiet mt-5" href="index.html">Back to the collection</a>
</div></div>
</section>
</main>

<div class="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="assets/app.js"></script>

</body>
</html>
